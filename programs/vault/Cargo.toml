[package]
name = "vault"
version = "0.1.0"
description = "On-chain vault for solana-symphony: owner-custodied, keeper-rebalanced via Jupiter"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "mock-swap?/idl-build"]
# TEST-ONLY. Routes `swap` through programs/mock-swap instead of Jupiter, for devnet testing.
# Never enable for a mainnet build. Built separately into target/deploy-devnet-mock/.
devnet-mock = ["dep:mock-swap"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "associated_token", "token_2022"] }  # token_2022 only because anchor-spl 1.2 IDL generation needs it; the program uses classic SPL Token only
pyth-solana-receiver-sdk = "2.0.0"
mock-swap = { path = "../mock-swap", features = ["cpi"], optional = true }  # devnet-mock only



[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
